[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pumpradar"
version = "0.4.0"
description = "PumpRadar platform starter: minute-bar ingestion and replay"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "websockets>=14,<17"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pumpradar", "api"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
