services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PUMPRADAR_DB: /state/alerts.sqlite3
    volumes:
      - ./state:/state
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    restart: unless-stopped
