name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PUMPRADAR_MOCK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev python -m pytest -q
      - run: uv run --locked --extra dev python -m ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: uv run --locked --extra dev python -m api.export_openapi
      - run: npm run typegen
        working-directory: web
      - name: Verify generated API contract is committed
        run: git diff --exit-code -- api/openapi.json web/src/api/types.ts
      - run: npm run build
        working-directory: web
      - name: Install browser for platform smoke tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify mock platform flows
        if: runner.os == 'Linux'
        run: npm run test:e2e
        working-directory: web
